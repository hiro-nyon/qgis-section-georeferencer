name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    # Only the QGIS-free modules are covered here: transforms, config_io, and
    # package_exporter. The PyQGIS tests (layer projector, dock state) skip
    # themselves here and run with the QGIS Python interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python -m unittest discover -s tests -v
