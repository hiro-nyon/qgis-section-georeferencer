<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Section Georeferencer: a building cross-section (the scanned drawing)
       pinned to PLATEAU by two GCP crosshairs. -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#2B7BD0" stroke="#1A5FA0" stroke-width="1.5"/>
  <!-- floor lines of the section drawing -->
  <g stroke="#FFFFFF" stroke-width="1.6" opacity="0.55">
    <line x1="17" y1="26" x2="41" y2="26"/>
    <line x1="17" y1="34" x2="41" y2="34"/>
    <line x1="17" y1="42" x2="49" y2="42"/>
  </g>
  <!-- building section outline: tower, rooftop structure, low podium -->
  <path d="M17 50 V18 H25 V11 H33 V18 H41 V34 H49 V50"
        fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- ground line -->
  <line x1="9" y1="50" x2="55" y2="50" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <!-- GCP crosshairs on two corners -->
  <g fill="none" stroke="#FF8A3D" stroke-width="2.6" stroke-linecap="round">
    <circle cx="17" cy="50" r="5.5"/>
    <line x1="17" y1="42" x2="17" y2="58"/>
    <line x1="9" y1="50" x2="25" y2="50"/>
    <circle cx="41" cy="18" r="5.5"/>
    <line x1="41" y1="10" x2="41" y2="26"/>
    <line x1="33" y1="18" x2="49" y2="18"/>
  </g>
</svg>
